<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Team Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background: radial-gradient(circle at 20% 50%, rgba(43, 116, 180, 0.3), transparent 50%), radial-gradient(circle at 80% 50%, rgba(51, 160, 201, 0.3), transparent 50%), linear-gradient(135deg, #08111f 0%, #0f1b32 100%); color: #edf3ff; min-height: 100vh;">
    <!-- Navigation -->
    <nav class="navbar navbar-dark" style="background: rgba(11, 18, 32, 0.9); border-bottom: 1px solid rgba(123, 223, 242, 0.2);">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">✓ Team Task Manager</span>
            <div class="d-flex gap-3 align-items-center">
                <span id="userName" style="color: #aab6cf;"></span>
                <button class="btn btn-sm" style="background: rgba(123, 223, 242, 0.2); color: #7bdff2; border: 1px solid rgba(123, 223, 242, 0.5);" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-5">
        <div class="row mb-4">
            <div class="col-md-3">
                <a href="dashboard.html" class="btn w-100" style="background: rgba(123, 223, 242, 0.2); color: #7bdff2; border: 1px solid rgba(123, 223, 242, 0.5); margin-bottom: 8px;">📊 Dashboard</a>
            </div>
            <div class="col-md-3">
                <a href="tasks.html" class="btn w-100" style="background: rgba(123, 223, 242, 0.3); color: #7bdff2; border: 1px solid rgba(123, 223, 242, 0.5); margin-bottom: 8px;">✓ Tasks</a>
            </div>
            <div class="col-md-3" id="projectsNavContainer" style="display: none;">
                <a href="projects.html" class="btn w-100" style="background: rgba(123, 223, 242, 0.2); color: #7bdff2; border: 1px solid rgba(123, 223, 242, 0.5); margin-bottom: 8px;">📁 Projects</a>
            </div>
        </div>

        <!-- Create Task Form -->
        <div id="createTaskPanel" style="background: rgba(11, 18, 32, 0.82); border-radius: 16px; padding: 24px; backdrop-filter: blur(18px); border: 1px solid rgba(123, 223, 242, 0.1); margin-bottom: 24px;">
            <h4 style="margin-bottom: 16px; color: #edf3ff;">New Task</h4>
            <form id="taskForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="text" class="form-control" id="taskTitle" placeholder="Task title..." required maxlength="150" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;">
                    </div>
                    <div class="col-md-6 mb-3">
                        <select class="form-control" id="taskStatus" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;">
                            <option value="PENDING">Pending</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="OVERDUE">Overdue</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="datetime-local" class="form-control" id="taskDueDate" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;">
                    </div>
                    <div class="col-md-6 mb-3" id="projectSelectContainer" style="display: none;">
                        <select class="form-control" id="taskProject" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;">
                            <option value="">Select project...</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <textarea class="form-control" id="taskDescription" placeholder="Task description..." maxlength="5000" rows="3" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;"></textarea>
                </div>
                <button type="submit" class="btn" style="background: linear-gradient(135deg, #7bdff2 0%, #4cc9f0 100%); color: #08111f; font-weight: 600; border: none;">Create Task</button>
            </form>
        </div>

        <!-- Tasks List -->
        <div style="background: rgba(11, 18, 32, 0.82); border-radius: 16px; padding: 24px; backdrop-filter: blur(18px); border: 1px solid rgba(123, 223, 242, 0.1);">
            <h4 style="margin-bottom: 16px; color: #edf3ff;">Your Tasks</h4>
            <div id="tasksList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;"></div>
        </div>
    </div>

    <div id="toastBanner" style="display: none; position: fixed; bottom: 20px; left: 20px; background: rgba(200, 50, 50, 0.9); color: #edf3ff; padding: 16px 20px; border-radius: 8px; max-width: 300px; font-size: 0.95rem;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('access_token');
        const API_PREFIX = `${window.location.origin}/api/v1`;
        
        if (!token) {
            window.location.href = 'login.html';
        }

        let userRole = 'MEMBER';

        async function loadPage() {
            try {
                // Load user info
                const userResponse = await fetch(`${API_PREFIX}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' },
                });
                if (!userResponse.ok) throw new Error('Failed to load user');
                const user = await userResponse.json();
                document.getElementById('userName').textContent = `Hello, ${user.name}`;
                userRole = user.role;

                // Show projects nav for admins
                if (user.role === 'ADMIN') {
                    document.getElementById('projectsNavContainer').style.display = 'block';
                    document.getElementById('projectSelectContainer').style.display = 'block';
                    loadProjects();
                }

                loadTasks();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function loadProjects() {
            try {
                const response = await fetch(`${API_PREFIX}/projects`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' },
                });
                if (!response.ok) return;
                const projects = await response.json();
                const select = document.getElementById('taskProject');
                select.innerHTML = '<option value="">Select project...</option>';
                projects.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.textContent = p.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load projects:', error);
            }
        }

        async function loadTasks() {
            try {
                const response = await fetch(`${API_PREFIX}/tasks`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' },
                });
                if (!response.ok) throw new Error('Failed to load tasks');
                const tasks = await response.json();
                renderTasks(tasks);
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasksList');
            if (tasks.length === 0) {
                container.innerHTML = '<div style="color: #aab6cf; text-align: center; grid-column: 1/-1; padding: 40px;">No tasks yet. Create one to get started!</div>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div style="background: rgba(20, 30, 48, 0.6); border-radius: 12px; padding: 16px; border: 1px solid rgba(123, 223, 242, 0.1);">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                        <h5 style="color: #edf3ff; margin: 0;">${escapeHtml(task.title)}</h5>
                        <span style="background: ${getStatusColor(task.status)}; color: #08111f; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;">${task.status}</span>
                    </div>
                    ${task.description ? `<p style="color: #aab6cf; font-size: 0.9rem; margin-bottom: 8px; margin-top: 0;">${escapeHtml(task.description)}</p>` : ''}
                    ${task.due_date ? `<p style="color: #aab6cf; font-size: 0.85rem; margin: 0;">${new Date(task.due_date).toLocaleString()}</p>` : ''}
                    <div style="display: flex; gap: 8px; margin-top: 12px;">
                        <button class="btn btn-sm" style="background: rgba(123, 223, 242, 0.3); color: #7bdff2; border: none; font-size: 0.85rem;" onclick="toggleStatus(${task.id}, '${task.status}')">Update Status</button>
                        ${userRole === 'ADMIN' ? `<button class="btn btn-sm" style="background: rgba(200, 50, 50, 0.3); color: #ff006e; border: none; font-size: 0.85rem;" onclick="deleteTask(${task.id})">Delete</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function getStatusColor(status) {
            const colors = {
                'PENDING': '#3b82f6',
                'IN_PROGRESS': '#f59e0b',
                'COMPLETED': '#10b981',
                'OVERDUE': '#ef4444'
            };
            return colors[status] || '#6b7280';
        }

        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const taskData = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDescription').value,
                status: document.getElementById('taskStatus').value,
                due_date: document.getElementById('taskDueDate').value || null,
                project_id: userRole === 'ADMIN' ? (document.getElementById('taskProject').value ? parseInt(document.getElementById('taskProject').value) : null) : null,
                assigned_to_id: null,
            };

            try {
                const response = await fetch(`${API_PREFIX}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(taskData),
                });

                if (!response.ok) throw new Error('Failed to create task');
                showToast('Task created successfully!', 'success');
                document.getElementById('taskForm').reset();
                loadTasks();
            } catch (error) {
                showToast(error.message, 'error');
            }
        });

        async function toggleStatus(taskId, currentStatus) {
            const statuses = ['PENDING', 'IN_PROGRESS', 'COMPLETED', 'OVERDUE'];
            const currentIndex = statuses.indexOf(currentStatus);
            const nextStatus = statuses[(currentIndex + 1) % statuses.length];

            try {
                const response = await fetch(`${API_PREFIX}/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ status: nextStatus }),
                });

                if (!response.ok) throw new Error('Failed to update task');
                loadTasks();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function deleteTask(taskId) {
            if (!confirm('Are you sure you want to delete this task?')) return;

            try {
                const response = await fetch(`${API_PREFIX}/tasks/${taskId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` },
                });

                if (!response.ok) throw new Error('Failed to delete task');
                showToast('Task deleted successfully!', 'success');
                loadTasks();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function showToast(message, type) {
            const toast = document.getElementById('toastBanner');
            toast.textContent = message;
            toast.style.background = type === 'success' ? 'rgba(50, 150, 100, 0.9)' : 'rgba(200, 50, 50, 0.9)';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = 'login.html';
        }

        loadPage();
    </script>
</body>
</html>
