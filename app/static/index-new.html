<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background: radial-gradient(circle at 20% 50%, rgba(43, 116, 180, 0.3), transparent 50%), radial-gradient(circle at 80% 50%, rgba(51, 160, 201, 0.3), transparent 50%), linear-gradient(135deg, #08111f 0%, #0f1b32 100%); color: #edf3ff; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
                <div style="background: rgba(11, 18, 32, 0.82); border-radius: 20px; padding: 60px 40px; backdrop-filter: blur(18px); border: 1px solid rgba(123, 223, 242, 0.1);">
                    <h1 style="color: #edf3ff; font-size: 3rem; font-weight: 700; margin-bottom: 16px;">Team Task Manager</h1>
                    <p style="color: #aab6cf; font-size: 1.1rem; margin-bottom: 40px;">Collaborate, organize, and track projects with ease.</p>
                    
                    <div style="display: flex; gap: 16px; justify-content: center;">
                        <a href="login.html" class="btn" style="background: linear-gradient(135deg, #7bdff2 0%, #4cc9f0 100%); color: #08111f; font-weight: 600; padding: 12px 32px; border: none; border-radius: 8px; text-decoration: none;">Sign In</a>
                        <a href="signup.html" class="btn" style="background: rgba(123, 223, 242, 0.2); color: #7bdff2; font-weight: 600; padding: 12px 32px; border: 1px solid rgba(123, 223, 242, 0.5); border-radius: 8px; text-decoration: none;">Create Account</a>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 48px; padding-top: 48px; border-top: 1px solid rgba(123, 223, 242, 0.1);">
                        <div>
                            <div style="font-size: 2rem; margin-bottom: 8px;">📊</div>
                            <h5 style="color: #edf3ff; margin-bottom: 8px;">Dashboard</h5>
                            <p style="color: #aab6cf; font-size: 0.9rem;">Track task statistics at a glance</p>
                        </div>
                        <div>
                            <div style="font-size: 2rem; margin-bottom: 8px;">✓</div>
                            <h5 style="color: #edf3ff; margin-bottom: 8px;">Task Management</h5>
                            <p style="color: #aab6cf; font-size: 0.9rem;">Create and organize your tasks</p>
                        </div>
                        <div>
                            <div style="font-size: 2rem; margin-bottom: 8px;">📁</div>
                            <h5 style="color: #edf3ff; margin-bottom: 8px;">Projects</h5>
                            <p style="color: #aab6cf; font-size: 0.9rem;">Manage team projects and members</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Redirect to dashboard if already logged in
        if (localStorage.getItem('team-task-manager-token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
