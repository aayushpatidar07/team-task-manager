<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Team Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: radial-gradient(circle at 20% 50%, rgba(43, 116, 180, 0.3), transparent 50%), radial-gradient(circle at 80% 50%, rgba(51, 160, 201, 0.3), transparent 50%), linear-gradient(135deg, #08111f 0%, #0f1b32 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div style="background: rgba(11, 18, 32, 0.82); border-radius: 20px; padding: 40px; backdrop-filter: blur(18px); border: 1px solid rgba(123, 223, 242, 0.1);">
                    <h1 class="text-center mb-4" style="color: #edf3ff; font-size: 2rem; font-weight: 700;">Team Task Manager</h1>
                    <h2 class="text-center mb-4" style="color: #aab6cf; font-size: 1.25rem;">Create Account</h2>

                    <form id="signupForm">
                        <div class="mb-3">
                            <label for="name" class="form-label" style="color: #edf3ff;">Full Name</label>
                            <input type="text" class="form-control" id="name" placeholder="John Doe" required style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label" style="color: #edf3ff;">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="your@email.com" required style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label" style="color: #edf3ff;">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="8" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;">
                            <small style="color: #aab6cf;">Minimum 8 characters</small>
                        </div>
                        <button type="submit" class="btn w-100 mb-3" style="background: linear-gradient(135deg, #7bdff2 0%, #4cc9f0 100%); color: #08111f; font-weight: 600; border: none;">Create Account</button>
                    </form>

                    <div class="text-center">
                        <p style="color: #aab6cf;">Already have an account? <a href="login.html" style="color: #7bdff2; text-decoration: none; font-weight: 600;">Sign in</a></p>
                    </div>

                    <div id="toastBanner" style="display: none; position: fixed; bottom: 20px; left: 20px; background: rgba(200, 50, 50, 0.9); color: #edf3ff; padding: 16px 20px; border-radius: 8px; max-width: 300px; font-size: 0.95rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password }),
                });

                if (!response.ok) {
                    const error = await response.json();
                    showToast(error.detail || 'Signup failed', 'error');
                    return;
                }

                showToast('Account created! Redirecting to login...', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (error) {
                showToast(error.message || 'Signup failed', 'error');
            }
        });

        function showToast(message, type) {
            const toast = document.getElementById('toastBanner');
            toast.textContent = message;
            toast.style.background = type === 'success' ? 'rgba(50, 150, 100, 0.9)' : 'rgba(200, 50, 50, 0.9)';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        // Redirect if already logged in
        if (localStorage.getItem('team-task-manager-token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
