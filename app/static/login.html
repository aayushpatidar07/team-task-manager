<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Team Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: radial-gradient(circle at 20% 50%, rgba(43, 116, 180, 0.3), transparent 50%), radial-gradient(circle at 80% 50%, rgba(51, 160, 201, 0.3), transparent 50%), linear-gradient(135deg, #08111f 0%, #0f1b32 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div style="background: rgba(11, 18, 32, 0.82); border-radius: 20px; padding: 40px; backdrop-filter: blur(18px); border: 1px solid rgba(123, 223, 242, 0.1);">
                    <h1 class="text-center mb-4" style="color: #edf3ff; font-size: 2rem; font-weight: 700;">Team Task Manager</h1>
                    <h2 class="text-center mb-4" style="color: #aab6cf; font-size: 1.25rem;">Login</h2>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label" style="color: #edf3ff;">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="your@email.com" required style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label" style="color: #edf3ff;">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;">
                        </div>
                        <button type="submit" class="btn w-100 mb-3" style="background: linear-gradient(135deg, #7bdff2 0%, #4cc9f0 100%); color: #08111f; font-weight: 600; border: none;">Sign In</button>
                    </form>

                    <div class="text-center">
                        <p style="color: #aab6cf;">Don't have an account? <a href="signup.html" style="color: #7bdff2; text-decoration: none; font-weight: 600;">Sign up</a></p>
                    </div>

                    <div id="toastBanner" style="display: none; position: fixed; bottom: 20px; left: 20px; background: rgba(200, 50, 50, 0.9); color: #edf3ff; padding: 16px 20px; border-radius: 8px; max-width: 300px; font-size: 0.95rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        const API_PREFIX = `${window.location.origin}/api/v1`;
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_PREFIX}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                if (!response.ok) {
                    const error = await response.json();
                    showToast(error.detail || 'Login failed', 'error');
                    return;
                }

                const data = await response.json();
                // store token under a standard key
                localStorage.setItem('access_token', data.access_token);
                showToast('Login successful!', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            } catch (error) {
                showToast(error.message || 'Login failed', 'error');
            }
        });

        function showToast(message, type) {
            const toast = document.getElementById('toastBanner');
            toast.textContent = message;
            toast.style.background = type === 'success' ? 'rgba(50, 150, 100, 0.9)' : 'rgba(200, 50, 50, 0.9)';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        // Redirect if already logged in
        if (localStorage.getItem('access_token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
