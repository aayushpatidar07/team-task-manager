<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Team Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background: radial-gradient(circle at 20% 50%, rgba(43, 116, 180, 0.3), transparent 50%), radial-gradient(circle at 80% 50%, rgba(51, 160, 201, 0.3), transparent 50%), linear-gradient(135deg, #08111f 0%, #0f1b32 100%); color: #edf3ff; min-height: 100vh;">
    <!-- Navigation -->
    <nav class="navbar navbar-dark" style="background: rgba(11, 18, 32, 0.9); border-bottom: 1px solid rgba(123, 223, 242, 0.2);">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📁 Team Task Manager</span>
            <div class="d-flex gap-3 align-items-center">
                <span id="userName" style="color: #aab6cf;"></span>
                <button class="btn btn-sm" style="background: rgba(123, 223, 242, 0.2); color: #7bdff2; border: 1px solid rgba(123, 223, 242, 0.5);" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-5">
        <div class="row mb-4">
            <div class="col-md-3">
                <a href="dashboard.html" class="btn w-100" style="background: rgba(123, 223, 242, 0.2); color: #7bdff2; border: 1px solid rgba(123, 223, 242, 0.5); margin-bottom: 8px;">📊 Dashboard</a>
            </div>
            <div class="col-md-3">
                <a href="tasks.html" class="btn w-100" style="background: rgba(123, 223, 242, 0.2); color: #7bdff2; border: 1px solid rgba(123, 223, 242, 0.5); margin-bottom: 8px;">✓ Tasks</a>
            </div>
            <div class="col-md-3">
                <a href="projects.html" class="btn w-100" style="background: rgba(123, 223, 242, 0.3); color: #7bdff2; border: 1px solid rgba(123, 223, 242, 0.5); margin-bottom: 8px;">📁 Projects</a>
            </div>
        </div>

        <!-- Create Project Form -->
        <div style="background: rgba(11, 18, 32, 0.82); border-radius: 16px; padding: 24px; backdrop-filter: blur(18px); border: 1px solid rgba(123, 223, 242, 0.1); margin-bottom: 24px;">
            <h4 style="margin-bottom: 16px; color: #edf3ff;">New Project</h4>
            <form id="projectForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="text" class="form-control" id="projectName" placeholder="Project name..." required maxlength="150" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;">
                    </div>
                    <div class="col-md-6 mb-3">
                        <div style="display: flex; gap: 8px;">
                            <input type="text" class="form-control" id="memberEmail" placeholder="Add member email..." style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;">
                            <button type="button" class="btn" style="background: rgba(123, 223, 242, 0.3); color: #7bdff2; border: none; white-space: nowrap;" onclick="addMemberField()">+ Add</button>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <textarea class="form-control" id="projectDescription" placeholder="Project description..." maxlength="5000" rows="3" style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(123, 223, 242, 0.3); color: #edf3ff;"></textarea>
                </div>
                <div id="membersList" style="margin-bottom: 16px;"></div>
                <button type="submit" class="btn" style="background: linear-gradient(135deg, #7bdff2 0%, #4cc9f0 100%); color: #08111f; font-weight: 600; border: none;">Create Project</button>
            </form>
        </div>

        <!-- Projects List -->
        <div style="background: rgba(11, 18, 32, 0.82); border-radius: 16px; padding: 24px; backdrop-filter: blur(18px); border: 1px solid rgba(123, 223, 242, 0.1);">
            <h4 style="margin-bottom: 16px; color: #edf3ff;">Your Projects</h4>
            <div id="projectsList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px;"></div>
        </div>
    </div>

    <div id="toastBanner" style="display: none; position: fixed; bottom: 20px; left: 20px; background: rgba(200, 50, 50, 0.9); color: #edf3ff; padding: 16px 20px; border-radius: 8px; max-width: 300px; font-size: 0.95rem;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('team-task-manager-token');
        if (!token) {
            window.location.href = 'login.html';
        }

        let allUsers = [];
        let selectedMemberIds = [];

        async function loadPage() {
            try {
                // Load user info
                const userResponse = await fetch('/api/v1/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                if (!userResponse.ok) throw new Error('Failed to load user');
                const user = await userResponse.json();
                document.getElementById('userName').textContent = `Hello, ${user.name}`;

                // Check if admin
                if (user.role !== 'ADMIN') {
                    window.location.href = 'dashboard.html';
                }

                loadProjects();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        async function loadProjects() {
            try {
                const response = await fetch('/api/v1/projects', {
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                if (!response.ok) throw new Error('Failed to load projects');
                const projects = await response.json();
                renderProjects(projects);
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function renderProjects(projects) {
            const container = document.getElementById('projectsList');
            if (projects.length === 0) {
                container.innerHTML = '<div style="color: #aab6cf; text-align: center; grid-column: 1/-1; padding: 40px;">No projects yet. Create one to get started!</div>';
                return;
            }

            container.innerHTML = projects.map(project => `
                <div style="background: rgba(20, 30, 48, 0.6); border-radius: 12px; padding: 16px; border: 1px solid rgba(123, 223, 242, 0.1);">
                    <h5 style="color: #edf3ff; margin-bottom: 8px;">${escapeHtml(project.name)}</h5>
                    ${project.description ? `<p style="color: #aab6cf; font-size: 0.9rem; margin-bottom: 8px;">${escapeHtml(project.description)}</p>` : ''}
                    <p style="color: #aab6cf; font-size: 0.85rem; margin-bottom: 12px;">
                        <strong>${project.team_member_ids.length}</strong> team member(s)
                    </p>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button class="btn btn-sm" style="background: rgba(123, 223, 242, 0.3); color: #7bdff2; border: none; font-size: 0.85rem;" onclick="editProject(${project.id})">Edit</button>
                        <button class="btn btn-sm" style="background: rgba(123, 223, 242, 0.3); color: #7bdff2; border: none; font-size: 0.85rem;" onclick="toggleMembers(${project.id})">Members</button>
                        <button class="btn btn-sm" style="background: rgba(200, 50, 50, 0.3); color: #ff006e; border: none; font-size: 0.85rem;" onclick="deleteProject(${project.id})">Delete</button>
                    </div>
                    <div id="members-${project.id}" style="display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(123, 223, 242, 0.2);"></div>
                </div>
            `).join('');
        }

        function addMemberField() {
            const email = document.getElementById('memberEmail').value.trim();
            if (!email) {
                showToast('Please enter an email address', 'error');
                return;
            }
            // In a real app, you'd look up the user by email
            // For now, just show a placeholder
            showToast('Note: You need to enter valid user IDs in the API', 'error');
        }

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const projectData = {
                name: document.getElementById('projectName').value,
                description: document.getElementById('projectDescription').value,
                team_member_ids: selectedMemberIds,
            };

            try {
                const response = await fetch('/api/v1/projects', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(projectData),
                });

                if (!response.ok) throw new Error('Failed to create project');
                showToast('Project created successfully!', 'success');
                document.getElementById('projectForm').reset();
                selectedMemberIds = [];
                document.getElementById('membersList').innerHTML = '';
                loadProjects();
            } catch (error) {
                showToast(error.message, 'error');
            }
        });

        function editProject(projectId) {
            showToast('Edit functionality coming soon', 'error');
        }

        async function toggleMembers(projectId) {
            const container = document.getElementById(`members-${projectId}`);
            if (container.style.display === 'none') {
                container.style.display = 'block';
                // In a real app, load and display members
                container.innerHTML = '<p style="color: #aab6cf; font-size: 0.9rem;">Members management coming soon</p>';
            } else {
                container.style.display = 'none';
            }
        }

        async function deleteProject(projectId) {
            if (!confirm('Are you sure you want to delete this project? All associated tasks will be deleted.')) return;

            try {
                const response = await fetch(`/api/v1/projects/${projectId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` },
                });

                if (!response.ok) throw new Error('Failed to delete project');
                showToast('Project deleted successfully!', 'success');
                loadProjects();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function showToast(message, type) {
            const toast = document.getElementById('toastBanner');
            toast.textContent = message;
            toast.style.background = type === 'success' ? 'rgba(50, 150, 100, 0.9)' : 'rgba(200, 50, 50, 0.9)';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function logout() {
            localStorage.removeItem('team-task-manager-token');
            window.location.href = 'login.html';
        }

        loadPage();
    </script>
</body>
</html>
